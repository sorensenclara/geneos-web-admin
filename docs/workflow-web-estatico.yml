# Workflow para los repositorios web-gerp, web-geagro y web-gema cuando publica GENEOS Web Admin.
# Copiar como .github/workflows/pages.yml en cada repositorio (reemplaza al que regenera la web por su cuenta).
# Publica en GitHub Pages exactamente los archivos que dejó el administrador: no genera nada.
# Con Cloudflare Pages no hace falta: Cloudflare publica la rama directamente (sin comando de compilación,
# carpeta de salida «/»), y usa los archivos _headers y _redirects que genera el administrador.
name: Publicar en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
